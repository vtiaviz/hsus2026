name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hsus
          POSTGRES_USER: hsus
          POSTGRES_PASSWORD: hsus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hsus"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hsus:hsus@localhost:5432/hsus
      SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
