{% extends "base.html" %}
{% block content %}
  <h1 class="h3">Olá, {{ user }}</h1>
  {% if user.role_labels %}
    <p class="text-secondary">Perfil: {{ user.role_labels|join:", " }}</p>
  {% elif not user.is_superuser %}
    <div class="alert alert-warning">Seu usuário ainda não tem perfil; procure o administrador.</div>
  {% endif %}
{% endblock %}
