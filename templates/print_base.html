{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>{% block title %}H-SUS{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/hsus.css' %}">
  <style>
    @page { size: A4; margin: 2cm; }
    body { font-size: 12pt; }
    .signature { margin-top: 4cm; border-top: 1px solid #000; width: 60%; margin-left: auto; margin-right: auto; text-align: center; padding-top: .25rem; }
  </style>
</head>
<body class="container py-4">
  <div class="no-print mb-3"><button type="button" class="btn btn-primary" onclick="window.print()">Imprimir</button></div>
  <header class="text-center mb-4">
    <h1 class="h5 mb-0">{{ care_session.establishment.name }}</h1>
    <div class="small">CNES {{ care_session.establishment.cnes }} · {{ care_session.establishment.municipality }}</div>
  </header>
  {% block document %}{% endblock %}
</body>
</html>
