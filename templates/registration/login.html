{% extends "base.html" %}
{% block title %}Entrar · H-SUS{% endblock %}
{% block public_content %}
  <div class="mx-auto" style="max-width: 360px">
    <h1 class="h4 mb-3">Entrar no H-SUS</h1>
    {% if form.errors %}
      <div class="alert alert-danger">Usuário ou senha incorretos.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="id_username">Usuário</label>
        <input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Senha</label>
        <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>
{% endblock %}
